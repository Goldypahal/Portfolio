<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goldy Pahal — AI/ML Engineer · Developer · Researcher</title>
  <meta name="description" content="Portfolio of Goldy Pahal — Computer Science Engineering student specializing in AI & ML. Machine learning, generative AI, computer vision, and software engineering." />
</head>
<body>

  <!-- Full-Screen Animated Sun Preloader -->
  <div id="app-preloader"></div>

  <!-- Dynamic Sky-to-Space Background Canvas Layer -->
  <div id="sky-bg"></div>
  <canvas id="star-canvas"></canvas>
  <canvas id="nothin-liquid-canvas"></canvas>
  <div id="app-clouds"></div>

  <!-- Tactile SVG Film Grain Texture Overlay -->
  <div class="grain-overlay"></div>

  <!-- Animated Sun Object (Recreated from User Image) -->
  <div id="hero-sun">
    <img src="/src/assets/sun.svg" alt="Artistic Sun" />
  </div>

  <!-- Application Section Mount Points -->
  <div id="app-hero"></div>
  <div id="app-about"></div>
  <div id="app-skills"></div>
  <div id="app-exploring"></div>

  <!-- Scroll journey (moon -> projects -> black hole + contact block) mount point.
       SpaceJourney renders #app-space (contact block) inside its own stage. -->
  <div id="app-journey"></div>

  <!-- Main JavaScript App Entry -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
